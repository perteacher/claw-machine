<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>손인형뽑기 · Hand Claw Machine</title>
<style>
  :root{
    --glass: rgba(20,24,38,0.55);
    --glass-bd: rgba(255,255,255,0.14);
    --txt: #eef1ff;
    --accent: #7ef0c0;
    --gold: #ffd56b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;width:100%;overflow:hidden;background:#05060c;color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  #app{position:fixed;inset:0}
  canvas{display:block}

  /* ---------- HUD ---------- */
  .hud{position:fixed;z-index:20;pointer-events:none}
  #counter{top:max(14px,env(safe-area-inset-top));left:14px;
    background:var(--glass);border:1px solid var(--glass-bd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    padding:10px 16px;border-radius:16px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;
    box-shadow:0 8px 30px rgba(0,0,0,0.4)}
  #counter b{color:var(--accent);font-size:20px;font-variant-numeric:tabular-nums}
  #counter .ic{font-size:18px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}

  #hint{left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);
    background:var(--glass);border:1px solid var(--glass-bd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    padding:9px 16px;border-radius:14px;font-size:13px;opacity:.92;text-align:center;line-height:1.5;
    max-width:92vw}
  #hint .k{color:var(--gold);font-weight:700}

  #toast{left:50%;top:74px;transform:translate(-50%,-12px);
    padding:11px 22px;border-radius:14px;font-weight:800;font-size:17px;letter-spacing:.3px;
    background:var(--glass);border:1px solid var(--glass-bd);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    opacity:0;transition:opacity .25s ease, transform .25s ease;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.ok{color:#0c1410;background:linear-gradient(135deg,#9ff7cf,#5fd3a4);border-color:#bfffe4}
  #toast.bad{color:#fff;background:linear-gradient(135deg,#ff8a8a,#e85b6a);border-color:#ffc9c9}
  #toast.info{color:var(--txt)}

  /* top-right mode toggle */
  #modeBtn{top:max(14px,env(safe-area-inset-top));right:14px;pointer-events:auto;cursor:pointer;
    background:var(--glass);border:1px solid var(--glass-bd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    color:var(--txt);padding:9px 13px;border-radius:14px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;
    box-shadow:0 8px 30px rgba(0,0,0,.4)}
  #modeBtn:active{transform:scale(.96)}

  /* webcam preview */
  #preview{position:fixed;right:14px;bottom:max(14px,env(safe-area-inset-bottom));z-index:21;
    width:160px;height:120px;border-radius:14px;overflow:hidden;display:none;
    border:1px solid var(--glass-bd);box-shadow:0 8px 30px rgba(0,0,0,.5);background:#000}
  #preview.on{display:block}
  #preview video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  #preview .lbl{position:absolute;left:8px;top:6px;font-size:10px;font-weight:700;opacity:.85;
    background:rgba(0,0,0,.4);padding:2px 7px;border-radius:8px}
  @media (max-width:520px){ #preview{width:120px;height:90px} }

  /* ---------- start overlay ---------- */
  #overlay{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:26px;padding:24px;text-align:center;
    background:radial-gradient(120% 90% at 50% 20%, rgba(40,30,70,.55), rgba(4,5,12,.92) 70%);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  #overlay h1{font-size:clamp(26px,7vw,44px);font-weight:900;letter-spacing:-.5px;
    background:linear-gradient(135deg,#ffd56b,#ff9ecb 45%,#7ef0c0);-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 6px 30px rgba(255,160,200,.15)}
  #overlay p.sub{opacity:.8;font-size:clamp(13px,3.5vw,16px);max-width:36ch;line-height:1.6}
  .btns{display:flex;flex-direction:column;gap:14px;width:min(340px,86vw)}
  .btn{pointer-events:auto;cursor:pointer;border:1px solid var(--glass-bd);border-radius:18px;
    padding:18px 20px;font-size:17px;font-weight:800;color:var(--txt);display:flex;align-items:center;justify-content:center;gap:10px;
    transition:transform .12s ease, box-shadow .2s ease}
  .btn:active{transform:scale(.97)}
  .btn.cam{background:linear-gradient(135deg,#6c8cff,#9b6bff);box-shadow:0 12px 40px rgba(120,110,255,.4)}
  .btn.mouse{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .btn .em{font-size:20px}
  #overlay .note{font-size:11.5px;opacity:.55;max-width:38ch;line-height:1.5}
  #loading{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;
    background:rgba(4,5,12,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #loading.on{display:flex}
  .spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:var(--accent);
    animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>

<!-- HUD -->
<div id="counter" class="hud"><span class="ic">🧸</span> 담은 인형 <b id="score">0</b></div>
<button id="modeBtn" class="hud">🖐 <span id="modeLbl">모드</span></button>
<div id="hint" class="hud"></div>
<div id="toast" class="hud"></div>

<div id="preview"><span class="lbl">CAM</span><video id="video" playsinline muted></video></div>

<!-- start overlay -->
<div id="overlay">
  <h1>손인형뽑기</h1>
  <p class="sub">웹캠으로 손을 인식해 크레인을 조종해요.<br>손을 <b>쥐면</b> 집게가 내려가 인형을 집고, <b>펴면</b> 집게가 스스로 <b>배출구</b>로 가서 떨어뜨려요. 🎁<br>실제 기계처럼 <b>가끔 미끄러져요!</b></p>
  <div class="btns">
    <button class="btn cam" id="startCam"><span class="em">📷</span> 카메라로 시작</button>
    <button class="btn mouse" id="startMouse"><span class="em">🖱️</span> 마우스·터치로 시작</button>
  </div>
  <p class="note">카메라는 HTTPS(또는 localhost)에서만 작동해요. 권한을 거부하면 자동으로 마우스 모드로 전환됩니다.</p>
</div>

<div id="loading"><div class="spin"></div><div>카메라 준비 중…</div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

/* ============================================================
   CFG — 튜닝 상수 (v2)
   ============================================================ */
const CFG = {
  // 유리 케이스 내부
  caseX:[-2.5, 2.5], caseZ:[-2.0, 2.0], caseH:3.6,
  // 집게 도달 범위 (케이스 안쪽, 인형 반경 고려)
  clawX:[-2.2, 2.2], clawZ:[-1.7, 1.7],
  restY:3.2, grabY:0.5, topY:4.6,
  descendTime:1.0, ascendTime:1.0,        // 하강/상승 각 ~1초
  grabRadius:0.6,
  // 배출구(코너 칸막이 + 바닥 구멍)
  chuteX:-1.7, chuteZ:1.4, chuteHalf:0.6, dividerH:0.85,
  // 인형 스폰(집게 도달 범위 안, chute 코너 제외)
  spawnX:[-1.9, 1.9], spawnZ:[-1.5, 0.9], nBalls:26,
  // 카메라 손 인식
  pinchThreshold:0.55, handXRange:[0.1, 0.9], handYRange:[0.25, 0.78], smooth:0.25,
  invertZ:false,
  // 확률 집기
  grabFirmRate:0.35, grabWeakRate:0.40,   // TEASE = 나머지(0.25)
  weakSlipPerSec:0.6, teaseDropDelay:0.35, pityThreshold:4,
  // 내부 모션 타이밍(보조)
  closeTime:0.35, deliverTime:0.85, dropTime:0.5, dropY:1.6,
  lerpXZ:0.22, lerpY:0.12, lerpOpen:0.25,
  ceilingY:5.4
};

/* ============================================================
   기본 three 세팅
   ============================================================ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));   // dpr 2 캡
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07080f);
scene.fog = new THREE.Fog(0x07080f, 16, 34);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 100);
function placeCamera(){
  const portrait = innerHeight > innerWidth;
  camera.position.set(0, portrait?8.6:6.6, portrait?12.6:9.8);
  camera.lookAt(0, 1.2, 0);
}
placeCamera();

/* ---------- 조명 ---------- */
scene.add(new THREE.AmbientLight(0x5a5f8a, 0.85));
const hemi = new THREE.HemisphereLight(0x9ab0ff, 0x20141a, 0.6);
scene.add(hemi);

const key = new THREE.SpotLight(0xfff2d6, 110, 44, Math.PI/4.0, 0.4, 1.2);
key.position.set(3.5, 12, 6.5);
key.target.position.set(0, 0.5, 0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 2; key.shadow.camera.far = 32;
key.shadow.bias = -0.0004;
scene.add(key, key.target);

const fill = new THREE.PointLight(0xff7bd0, 16, 24, 2);
fill.position.set(-5, 4.5, 5);
scene.add(fill);
const fill2 = new THREE.PointLight(0x6bb7ff, 14, 24, 2);
fill2.position.set(5, 4, -2);
scene.add(fill2);
// 케이스 내부를 위에서 밝히는 부드러운 빛
const inner = new THREE.PointLight(0xfff0d0, 10, 10, 2);
inner.position.set(0, 3.2, 0);
scene.add(inner);

/* ============================================================
   방: 바닥 + 뒷벽
   ============================================================ */
const floorMat = new THREE.MeshStandardMaterial({color:0x14161f, roughness:0.95, metalness:0.05});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60,60), floorMat);
floor.rotation.x = -Math.PI/2; floor.position.y = -1.85; floor.receiveShadow = true;
scene.add(floor);

const wallMat = new THREE.MeshStandardMaterial({color:0x0d0f18, roughness:1, metalness:0});
const backWall = new THREE.Mesh(new THREE.PlaneGeometry(60,24), wallMat);
backWall.position.set(0,9,-7); backWall.receiveShadow = true;
scene.add(backWall);

/* ============================================================
   인형뽑기 기계 외형 (캐비닛)
   ============================================================ */
const cx0=CFG.caseX[0], cx1=CFG.caseX[1], cz0=CFG.caseZ[0], cz1=CFG.caseZ[1], cH=CFG.caseH;
const chx=CFG.chuteX, chz=CFG.chuteZ, chHalf=CFG.chuteHalf, divH=CFG.dividerH;
const cabinet = new THREE.Group(); scene.add(cabinet);

const matRed   = new THREE.MeshStandardMaterial({color:0xd8392f, roughness:0.5, metalness:0.1});
const matRedDk = new THREE.MeshStandardMaterial({color:0xa3271f, roughness:0.55, metalness:0.1});
const matWhite = new THREE.MeshStandardMaterial({color:0xf2f2f5, roughness:0.5, metalness:0.1});
const matBase  = new THREE.MeshStandardMaterial({color:0x2a1c2e, roughness:0.7, metalness:0.1});
const matGlass = new THREE.MeshStandardMaterial({color:0xaecbff, roughness:0.06, metalness:0.0,
  transparent:true, opacity:0.13, side:THREE.DoubleSide, depthWrite:false});

function boxMesh(w,h,d,x,y,z,m,shadow){
  const me=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m);
  me.position.set(x,y,z);
  if(shadow){ me.castShadow=true; me.receiveShadow=true; }
  cabinet.add(me); return me;
}

// 빨간 지붕(top)
boxMesh((cx1-cx0)+0.6, 0.5, (cz1-cz0)+0.6, 0, cH+0.25, 0, matRed, true);
boxMesh((cx1-cx0)+0.2, 0.16, (cz1-cz0)+0.2, 0, cH+0.55, 0, matRedDk, false);
// 상단 프레임 트림(빨강)
boxMesh((cx1-cx0)+0.2, 0.12, 0.12, 0, cH, cz1, matRed, false);
boxMesh((cx1-cx0)+0.2, 0.12, 0.12, 0, cH, cz0, matRed, false);
boxMesh(0.12, 0.12, (cz1-cz0)+0.2, cx0, cH, 0, matRed, false);
boxMesh(0.12, 0.12, (cz1-cz0)+0.2, cx1, cH, 0, matRed, false);

// 코너 프레임 기둥(흰/빨강) — 바닥(-1.8)부터 지붕까지
const postY = (cH+0.5 + (-1.8))/2, postH = (cH+0.5) - (-1.8);
for(const sx of [cx0,cx1]) for(const sz of [cz0,cz1]){
  boxMesh(0.18, postH, 0.18, sx, postY, sz, (sx<0?matRed:matWhite), true);
}

// 유리 4벽 (윗면 열림) — y 0 ~ caseH
boxMesh(0.05, cH, (cz1-cz0), cx0, cH/2, 0, matGlass, false); // left
boxMesh(0.05, cH, (cz1-cz0), cx1, cH/2, 0, matGlass, false); // right
boxMesh((cx1-cx0), cH, 0.05, 0, cH/2, cz0, matGlass, false); // back
boxMesh((cx1-cx0), cH, 0.05, 0, cH/2, cz1, matGlass, false); // front

// 케이스 바닥판(불투명) — chute 코너만 구멍(시각적으로도 비움)
//  A: 앞쪽 z[cz0,0.8] 전폭
boxMesh((cx1-cx0), 0.1, (0.8-cz0), 0, -0.05, (cz0+0.8)/2, matBase, true);
//  B: 뒤쪽 z[0.8,cz1] 중 구멍 오른쪽 x[-1.1,cx1]
boxMesh((cx1-(-1.1)), 0.1, (cz1-0.8), ((-1.1)+cx1)/2, -0.05, (0.8+cz1)/2, matBase, true);
//  C: 구멍 왼쪽 좁은 띠 → 구멍을 chute 점수영역(chx±chHalf)과 정확히 일치시킴
boxMesh((chx-chHalf)-cx0, 0.1, (cz1-0.8), (cx0+(chx-chHalf))/2, -0.05, (0.8+cz1)/2, matBase, true);
// 구멍 테두리(어두운 림)
const holeRim = new THREE.Mesh(new THREE.RingGeometry(0.1, chHalf*1.25, 4),
  new THREE.MeshStandardMaterial({color:0x0a0a0f, roughness:1, side:THREE.DoubleSide}));
holeRim.rotation.x = -Math.PI/2; holeRim.position.set(chx, 0.005, chz);
cabinet.add(holeRim);

// chute 칸막이 벽(낮음: 인형 못 넘되 집게는 넘음) — 안쪽 2면
boxMesh(0.09, divH, (cz1-0.8), -1.1, divH/2, (0.8+cz1)/2, matRedDk, true);     // x=-1.1 세로 칸막이
boxMesh(((-1.1)-cx0), divH, 0.09, ((cx0)+(-1.1))/2, divH/2, 0.8, matRedDk, true); // z=0.8 가로 칸막이
// chute 입구 표시(초록 발광 테두리)
const chuteGlowMat = new THREE.MeshStandardMaterial({color:0x0c2018, emissive:0x33ff99, emissiveIntensity:1.2, roughness:0.4});
const chuteRing = new THREE.Mesh(new THREE.TorusGeometry(chHalf*0.7, 0.04, 12, 36), chuteGlowMat);
chuteRing.rotation.x = Math.PI/2; chuteRing.position.set(chx, 0.12, chz);
cabinet.add(chuteRing);
const chuteGlow = new THREE.PointLight(0x33ff99, 5, 4, 2);
chuteGlow.position.set(chx, 0.4, chz); cabinet.add(chuteGlow);

// 하단 캐비닛 몸체(불투명) — 뒤/좌/우 패널 + 바닥. 전면 좌측은 열림(수거함 보임)
const lowY = -0.9;   // y[-1.8,0] 중앙
boxMesh((cx1-cx0)+0.12, 1.8, 0.1, 0, lowY, cz0, matBase, true);          // back
boxMesh(0.1, 1.8, (cz1-cz0)+0.12, cx0, lowY, 0, matBase, true);          // left
boxMesh(0.1, 1.8, (cz1-cz0)+0.12, cx1, lowY, 0, matBase, true);          // right
boxMesh((cx1-cx0)+0.12, 0.12, (cz1-cz0)+0.12, 0, -1.8, 0, matBase, true);// 캐비닛 바닥
// 전면 우측 컨트롤 패널 + 둥근 버튼 3개(장식)
boxMesh(2.3, 1.8, 0.1, 1.2, lowY, cz1, matRed, true);
const btnCols = [0x33ff99, 0xffd166, 0x6bb7ff];
for(let i=0;i<3;i++){
  const b = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.1,20),
    new THREE.MeshStandardMaterial({color:btnCols[i], emissive:btnCols[i], emissiveIntensity:0.45, roughness:0.4}));
  b.rotation.x = Math.PI/2; b.position.set(0.5+i*0.7, -0.7, cz1+0.06);
  cabinet.add(b);
}
// 전면 좌측 프라이즈 도어 프레임(빨강 띠)
boxMesh(0.08, 1.0, 0.08, chx-chHalf-0.05, -1.0, cz1, matRed, true);
boxMesh(0.08, 1.0, 0.08, chx+chHalf+0.05, -1.0, cz1, matRed, true);
boxMesh(chHalf*2+0.2, 0.08, 0.08, chx, -0.5, cz1, matRed, true);

/* ============================================================
   물리 세계 (cannon-es)
   ============================================================ */
const world = new CANNON.World({gravity:new CANNON.Vec3(0,-18,0)});
world.solver.iterations = 26;
world.solver.tolerance = 0.001;
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = true;

const matGround = new CANNON.Material('ground');
const matBall   = new CANNON.Material('ball');
world.addContactMaterial(new CANNON.ContactMaterial(matGround, matBall, {friction:0.5, restitution:0.03}));
world.addContactMaterial(new CANNON.ContactMaterial(matBall, matBall,   {friction:0.4, restitution:0.03}));

// 방 바닥(안전 바닥, 캐비닛 아래)
const groundBody = new CANNON.Body({mass:0, material:matGround, shape:new CANNON.Plane()});
groundBody.quaternion.setFromEuler(-Math.PI/2,0,0);
groundBody.position.set(0,-1.85,0);
world.addBody(groundBody);

function staticBox(hx,hy,hz,x,y,z){
  const b = new CANNON.Body({mass:0, material:matGround, shape:new CANNON.Box(new CANNON.Vec3(hx,hy,hz))});
  b.position.set(x,y,z); world.addBody(b); return b;
}

// 유리 케이스 물리벽 4면 (완전 밀폐, 안쪽면=경계)
const WT=0.1, WH=cH/2;
staticBox(WT, WH, (cz1-cz0)/2+0.1, cx0-WT, WH, 0);  // left
staticBox(WT, WH, (cz1-cz0)/2+0.1, cx1+WT, WH, 0);  // right
staticBox((cx1-cx0)/2+0.1, WH, WT, 0, WH, cz0-WT);  // back
staticBox((cx1-cx0)/2+0.1, WH, WT, 0, WH, cz1+WT);  // front

// 케이스 바닥 콜라이더 — chute 구멍만 빔
staticBox((cx1-cx0)/2, 0.1, (0.8-cz0)/2, 0, -0.05, (cz0+0.8)/2);          // A: 앞 전폭
staticBox((cx1-(-1.1))/2, 0.1, (cz1-0.8)/2, ((-1.1)+cx1)/2, -0.05, (0.8+cz1)/2); // B: 구멍 오른쪽
staticBox(((chx-chHalf)-cx0)/2, 0.1, (cz1-0.8)/2, (cx0+(chx-chHalf))/2, -0.05, (0.8+cz1)/2); // C: 구멍 왼쪽 띠
// 구멍 x[chx-chHalf,-1.1] z[0.8,cz1] → 바닥 없음 (= chute 점수영역과 동일)

// chute 칸막이 콜라이더 (인형 못 넘음)
staticBox(0.06, divH/2, (cz1-0.8)/2, -1.1, divH/2, (0.8+cz1)/2);          // x=-1.1
staticBox(((-1.1)-cx0)/2, divH/2, 0.06, ((cx0)+(-1.1))/2, divH/2, 0.8);   // z=0.8

// 하단 수거함(bin) — 구멍 아래, 떨어진 인형 받음 + 밖에서 보임
const binFloorY = -1.55, binWallY = -0.95, binHX = chHalf+0.12, binHZ = chHalf+0.12;
staticBox(binHX, 0.06, binHZ, chx, binFloorY, chz);                       // bin 바닥
staticBox(0.06, 0.62, binHZ, chx-binHX, binWallY, chz);                   // left
staticBox(0.06, 0.62, binHZ, chx+binHX, binWallY, chz);                   // right
staticBox(binHX, 0.62, 0.06, chx, binWallY, chz-binHZ);                   // back
// 앞면은 열어둠(수거함 보이게)

/* ============================================================
   플러시 인형 ~26개
   ============================================================ */
const CANDY = [0xff7eb6,0xffd166,0x8ad7ff,0xb6f06a,0xc89bff,0xffa45c,0xff9ecb,0x7ef0c0,0xffe28a,0x9bb8ff];
const dolls = [];   // {mesh, body, r, scored, parked}
const eyeMat = new THREE.MeshStandardMaterial({color:0x101015, roughness:0.4});
const eyeWhiteMat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.5});

function makeDoll(r, color){
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({color, roughness:0.62, metalness:0.0});
  const bodyMesh = new THREE.Mesh(new THREE.SphereGeometry(r, 28, 22), bodyMat);
  bodyMesh.castShadow = true; bodyMesh.receiveShadow = true;
  g.add(bodyMesh);
  const er = r*0.13;
  for(const sx of [-1,1]){
    const eye = new THREE.Mesh(new THREE.SphereGeometry(er, 12, 12), eyeMat);
    eye.position.set(sx*r*0.32, r*0.16, r*0.9);
    g.add(eye);
    const hl = new THREE.Mesh(new THREE.SphereGeometry(er*0.4, 8, 8), eyeWhiteMat);
    hl.position.set(sx*r*0.32 + er*0.3, r*0.16 + er*0.3, r*0.92);
    g.add(hl);
  }
  if(Math.random() < 0.45){
    const earR = r*0.34;
    for(const sx of [-1,1]){
      const ear = new THREE.Mesh(new THREE.SphereGeometry(earR, 14, 12), bodyMat);
      ear.position.set(sx*r*0.62, r*0.78, 0);
      ear.scale.set(0.8,1,0.7);
      ear.castShadow = true;
      g.add(ear);
    }
  }
  scene.add(g);
  return g;
}

// chute 코너(여유 포함) 안인가?
function inChuteArea(x,z,m){ m=m||0;
  return x > chx-chHalf-m && x < chx+chHalf+m && z > chz-chHalf-m && z < chz+chHalf+m; }

function spawnDolls(){
  for(let i=0;i<CFG.nBalls;i++){
    const r = 0.30 + Math.random()*0.16;          // 0.30 ~ 0.46
    const color = CANDY[Math.floor(Math.random()*CANDY.length)];
    const mesh = makeDoll(r, color);
    const body = new CANNON.Body({
      mass:1.0, material:matBall,
      shape:new CANNON.Sphere(r),
      linearDamping:0.25, angularDamping:0.55,
      allowSleep:true, sleepSpeedLimit:0.22, sleepTimeLimit:0.4
    });
    // chute 코너 제외하고 스폰
    let x,z, tries=0;
    do{
      x = THREE.MathUtils.lerp(CFG.spawnX[0]+r, CFG.spawnX[1]-r, Math.random());
      z = THREE.MathUtils.lerp(CFG.spawnZ[0]+r, CFG.spawnZ[1]-r, Math.random());
    }while(inChuteArea(x,z,0.25) && ++tries<12);
    body.position.set(x, 0.6 + (i%6)*0.5 + Math.random()*0.4, z);
    world.addBody(body);
    dolls.push({mesh, body, r, scored:false, parked:false});
  }
}
spawnDolls();

// 수거함 안에 정적 고정(점수 인형 깔끔히 쌓기)
let parkedCount = 0;
function parkInBin(d){
  d.parked = true;
  const n = parkedCount++, slot = n % 4, layer = Math.floor(n/4);
  const sx = (slot % 2) ? 0.26 : -0.26;
  const sz = (slot < 2) ? -0.26 : 0.26;
  d.body.type = CANNON.Body.STATIC;
  d.body.mass = 0; d.body.updateMassProperties();
  d.body.velocity.set(0,0,0); d.body.angularVelocity.set(0,0,0);
  d.body.position.set(chx + sx*Math.min(d.r/0.38,1), binFloorY + 0.06 + d.r + layer*0.42, chz + sz*Math.min(d.r/0.38,1));
  d.body.quaternion.set(0,0,0,1);
}

function respawnDoll(d){
  d.scored = false;
  d.body.wakeUp();
  d.body.velocity.set(0,0,0);
  d.body.angularVelocity.set(0,0,0);
  d.body.position.set((CFG.spawnX[0]+CFG.spawnX[1])/2 + (Math.random()-0.5)*1.2, 3.0, (CFG.spawnZ[0]+CFG.spawnZ[1])/2 + (Math.random()-0.5)*1.0);
}

const claw = new THREE.Group(); scene.add(claw);
const goldMat = new THREE.MeshStandardMaterial({color:0xffcf5a, roughness:0.28, metalness:0.95});
const goldDark = new THREE.MeshStandardMaterial({color:0xd9a533, roughness:0.35, metalness:0.9});

// 프롱 3개 — pivot(Y회전 120°) → opener(Z회전=개폐) → upper + hook(안쪽 갈고리)
const openers = [];
for(let i=0;i<3;i++){

  pivot.rotation.y = i*Math.PI*2/3;

// 케이블 (천장 → 허브)

function updateCable(){
  const topP = new THREE.Vector3(claw.position.x, CFG.ceilingY, claw.position.z);
  const botP = new THREE.Vector3(claw.position.x, claw.position.y+0.2, claw.position.z);
  const mid = topP.clone().add(botP).multiplyScalar(0.5);
  const len = topP.distanceTo(botP);
  cable.position.copy(mid);
  cable.scale.y = len;
  cable.lookAt(topP);
  cable.rotateX(Math.PI/2);
  ceilMount.position.set(claw.position.x, CFG.ceilingY, claw.position.z);
}

   입력 (손 / 마우스·터치 공용)
   ============================================================ */
const input = { x:0, z:0, pinch:false, has:false };
let mode = 'mouse';
let lastHandTs = 0;
let smX=0, smZ=0, smInit=false;   // 손 좌표 저역통과 상태

function clampClaw(x,z){
  return [
    THREE.MathUtils.clamp(x, CFG.clawX[0], CFG.clawX[1]),
    THREE.MathUtils.clamp(z, CFG.clawZ[0], CFG.clawZ[1])
  ];
}

/* ---------- 마우스 / 터치 ---------- */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const dragPlane = new THREE.Plane(new THREE.Vector3(0,1,0), -CFG.grabY);
const hitPt = new THREE.Vector3();

function pointerToClaw(clientX, clientY){
  ndc.x = (clientX/innerWidth)*2 - 1;
  ndc.y = -(clientY/innerHeight)*2 + 1;
  raycaster.setFromCamera(ndc, camera);
  if(raycaster.ray.intersectPlane(dragPlane, hitPt)){
    const [cx,cz] = clampClaw(hitPt.x, hitPt.z);
    input.x = cx; input.z = cz; input.has = true;
  }
}
function onPointerDown(e){ if(mode!=='mouse') return; pointerToClaw(e.clientX,e.clientY); input.pinch = true; }
function onPointerMove(e){ if(mode!=='mouse') return; pointerToClaw(e.clientX,e.clientY); }
function onPointerUp(){ if(mode!=='mouse') return; input.pinch = false; }
renderer.domElement.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', onPointerUp);

/* ---------- MediaPipe Hands (lazy load) ---------- */
const videoEl = document.getElementById('video');
const previewEl = document.getElementById('preview');
let mpHands = null, mpCamera = null, camActive = false;

function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src=src; s.crossOrigin='anonymous';
    s.onload=res; s.onerror=()=>rej(new Error('load fail: '+src)); document.head.appendChild(s);
  });
}

function onHands(results){
  const list = results.multiHandLandmarks;
  if(!list || !list.length){ return; }
  const lm = list[0];
  const p0=lm[0], p9=lm[9], p4=lm[4], p8=lm[8];
  // 좌우(x): handXRange → clawX 전체 (셀피 미러 = x 반전)
  const nxRaw = 1 - p9.x;
  const nx = THREE.MathUtils.clamp((nxRaw - CFG.handXRange[0])/(CFG.handXRange[1]-CFG.handXRange[0]), 0, 1);
  // 앞뒤(z): handYRange(중앙 밴드) → clawZ 전체 확장 + 클램프
  let nz = THREE.MathUtils.clamp((p9.y - CFG.handYRange[0])/(CFG.handYRange[1]-CFG.handYRange[0]), 0, 1);
  if(CFG.invertZ) nz = 1 - nz;
  const cx = THREE.MathUtils.lerp(CFG.clawX[0], CFG.clawX[1], nx);
  const cz = THREE.MathUtils.lerp(CFG.clawZ[0], CFG.clawZ[1], nz);
  const [ccx,ccz] = clampClaw(cx,cz);
  if(!smInit){ smX=ccx; smZ=ccz; smInit=true; }
  smX += (ccx - smX) * CFG.smooth;     // 떨림 방지 저역통과
  smZ += (ccz - smZ) * CFG.smooth;
  input.x = smX; input.z = smZ; input.has = true;
  // 핀치 = dist(4,8)/handSize < threshold,  handSize = dist(0,9)
  const handSize = Math.hypot(p0.x-p9.x, p0.y-p9.y) || 1e-3;
  const pinchDist = Math.hypot(p4.x-p8.x, p4.y-p8.y);
  input.pinch = (pinchDist/handSize) < CFG.pinchThreshold;
  lastHandTs = performance.now();
}

async function startCameraMode(){
  document.getElementById('loading').classList.add('on');
  try{
    if(!mpHands){
      await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js');
      await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js');
      mpHands = new window.Hands({locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}`});
      mpHands.setOptions({maxNumHands:1, modelComplexity:0, minDetectionConfidence:0.6, minTrackingConfidence:0.6});
      mpHands.onResults(onHands);
    }
    mpCamera = new window.Camera(videoEl, {
      onFrame: async()=>{ if(camActive) await mpHands.send({image:videoEl}); },
      width:640, height:480
    });
    await mpCamera.start();   // getUserMedia 권한 요청 → 거부 시 throw
    camActive = true;
    mode = 'cam';
    previewEl.classList.add('on');
    setModeLabel();
    toast('카메라 모드 · 손을 펴고 움직여보세요 ✋', 'info', 2600);
  }catch(err){
    console.warn('camera failed → mouse fallback', err);
    mode = 'mouse';
    previewEl.classList.remove('on');
    camActive = false;
    setModeLabel();
    toast('카메라를 쓸 수 없어 마우스 모드로 전환했어요', 'bad', 3200);
  }finally{
    document.getElementById('loading').classList.remove('on');
  }
}
function stopCameraMode(){
  camActive = false;
  smInit = false;   // 다음 카메라 진입 시 스무딩 콜드스타트(스냅 방지)
  previewEl.classList.remove('on');
  try{ mpCamera && mpCamera.stop && mpCamera.stop(); }catch(e){}
  const tr = videoEl.srcObject; if(tr){ tr.getTracks().forEach(t=>t.stop()); videoEl.srcObject=null; }
}

/* ============================================================
   잡기 상태머신 (확률 집기 + 자동 배출)
   idle → descend → close → ascend → hold → deliver → drop → idle
   ============================================================ */
let state = 'idle';
let phaseT = 0;              // 현재 state 진입 후 경과시간
let openAmount = 1;          // 1 열림, 0 닫힘
let held = null;            // doll
let grade = null;          // 'FIRM' | 'WEAK' | 'TEASE'
let heldClock = 0;         // 집은 뒤 경과(슬립/약올림 판정용)
let failStreak = 0;        // 연속 미배달(pity용)
const grabPos = new THREE.Vector3();      // 집는 시퀀스 동안 고정 XZ
const deliverStart = new THREE.Vector3(); // deliver 시작 XZ
const OPEN_CLOSED = 0.087, OPEN_OPEN = 0.489;   // 닫힘 ~5°, 열림 ~28°

function setState(s){ state=s; phaseT=0; }
const smooth01 = (t)=>THREE.MathUtils.smoothstep(THREE.MathUtils.clamp(t,0,1),0,1);

function rollGrade(){
  if(failStreak >= CFG.pityThreshold){ failStreak = 0; return 'FIRM'; }   // 사장 자비
  const r = Math.random();
  if(r < CFG.grabFirmRate) return 'FIRM';
  if(r < CFG.grabFirmRate + CFG.grabWeakRate) return 'WEAK';
  return 'TEASE';
}

function pickNearest(){
  let best=null, bestD=CFG.grabRadius;
  const cx=claw.position.x, cz=claw.position.z;
  for(const d of dolls){
    if(d===held || d.parked) continue;
    const p=d.body.position;
    const dist = Math.hypot(p.x-cx, p.z-cz);
    if(dist < bestD && Math.abs(p.y - CFG.grabY) < 1.2){ bestD=dist; best=d; }
  }
  return best;
}

function attemptGrab(){
  const d = pickNearest();
  if(d){
    held = d; grade = rollGrade(); heldClock = 0;
    d.body.sleep();
  }else{
    failStreak++;   // 헛집음도 미배달
  }
}

// 잡은 인형 놓침(슬립/약올림) — 케이스 바닥으로 떨어짐 = 실패
function slipDrop(reason){
  if(!held) return;
  const d = held; held = null; grade = null;
  d.scored = false;
  d.body.wakeUp();
  d.body.velocity.set((Math.random()-0.5)*1.6, -0.4, (Math.random()-0.5)*1.6);
  d.body.angularVelocity.set((Math.random()-0.5)*5,(Math.random()-0.5)*5,(Math.random()-0.5)*5);
  failStreak++;
  openAmount = 1;   // 프롱 탁 벌림
  toast(reason==='tease' ? '앗, 약올리고 놓쳤다 😜' : '헐겁게 물렸나봐요 😣', 'bad', 1300);
}

// 들고 있는 동안 슬립/약올림 판정 (ascend/hold/deliver)
function tickGrip(dt){
  if(!held) return;
  heldClock += dt;
  if(grade==='WEAK'){
    if(Math.random() < CFG.weakSlipPerSec*dt) slipDrop('weak');
  }else if(grade==='TEASE'){
    if(heldClock > CFG.teaseDropDelay) slipDrop('tease');
  }
}

function updateState(dt){
  switch(state){
    case 'idle':
      if(input.pinch){ grabPos.set(claw.position.x, 0, claw.position.z); setState('descend'); }
      break;
    case 'descend':
      if(!input.pinch){ setState('idle'); break; }     // 중도 취소 → 제자리서 idle 복귀(스냅 없음)
      if(phaseT >= CFG.descendTime){ setState('close'); }
      break;
    case 'close':
      if(phaseT >= CFG.closeTime){ attemptGrab(); setState('ascend'); }
      break;
    case 'ascend':
      tickGrip(dt);
      if(phaseT >= CFG.ascendTime){ setState(held ? 'hold' : 'idle'); }
      break;
    case 'hold':
      tickGrip(dt);
      if(!input.pinch){
        if(held){ deliverStart.set(claw.position.x,0,claw.position.z); setState('deliver'); }
        else setState('idle');
      }
      break;
    case 'deliver':
      tickGrip(dt);
      if(!held){ setState('idle'); break; }            // 이동 중 슬립 → 취소
      if(phaseT >= CFG.deliverTime){ setState('drop'); }
      break;
    case 'drop':
      if(phaseT >= CFG.dropTime){
        if(held){ const d=held; held=null; grade=null; d.body.wakeUp(); d.body.velocity.set(0,-1,0); d.body.angularVelocity.set(0,0,0); }
        setState('idle');
      }
      break;
  }
}

// 집게 Y 목표(시간기반)
function clawTargetY(){
  switch(state){
    case 'descend': return THREE.MathUtils.lerp(CFG.restY, CFG.grabY, smooth01(phaseT/CFG.descendTime));
    case 'close':   return CFG.grabY;
    case 'ascend':  return THREE.MathUtils.lerp(CFG.grabY, CFG.topY, smooth01(phaseT/CFG.ascendTime));
    case 'hold':
    case 'deliver': return CFG.topY;
    case 'drop':    return THREE.MathUtils.lerp(CFG.topY, CFG.dropY, smooth01(phaseT/CFG.dropTime));
    default:        return CFG.restY;   // idle
  }
}
// 프롱 개폐 목표 (1 열림, 0 닫힘)
function gripOpen(){ return grade==='FIRM' ? 0 : 0.35; }   // WEAK/TEASE는 헐겁게
function clawTargetOpen(){
  switch(state){
    case 'descend': return 1;
    case 'close':   return THREE.MathUtils.lerp(1, 0, smooth01(phaseT/CFG.closeTime));
    case 'ascend':
    case 'hold':
    case 'deliver': return held ? gripOpen() : 1;
    case 'drop':    return 1;
    default:        return 1;   // idle
  }
}

/* 성공 파티클 버스트 */
const sparks = [];
const sparkMat = new THREE.MeshBasicMaterial({color:0x9ff7cf});
function burst(x,y,z){
  for(let i=0;i<14;i++){
    const s=new THREE.Mesh(new THREE.SphereGeometry(0.06,6,6), sparkMat.clone());
    s.position.set(x, y, z);
    s.userData.v = new THREE.Vector3((Math.random()-0.5)*4, 3+Math.random()*3, (Math.random()-0.5)*4);
    s.userData.life = 1.0;
    scene.add(s); sparks.push(s);
  }
}
function updateSparks(dt){
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i];
    s.userData.v.y -= 9*dt;
    s.position.addScaledVector(s.userData.v, dt);
    s.userData.life -= dt*1.3;
    s.scale.setScalar(Math.max(0.01, s.userData.life));
    if(s.userData.life<=0){ scene.remove(s); sparks.splice(i,1); }
  }
}

/* ============================================================
   메인 루프
   ============================================================ */
const clock = new THREE.Clock();
let started = false;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 1/30);
  const t = clock.elapsedTime;

  if(started){
    // ---- 집게 XZ 목표 ----
    if(state==='idle' || state==='hold'){
      if(input.has){
        claw.position.x += (input.x - claw.position.x)*CFG.lerpXZ;
        claw.position.z += (input.z - claw.position.z)*CFG.lerpXZ;
      }
    }else if(state==='descend' || state==='close' || state==='ascend'){
      claw.position.x = grabPos.x; claw.position.z = grabPos.z;   // 집는 시퀀스: 고정
    }else if(state==='deliver'){
      const p = smooth01(phaseT/CFG.deliverTime);                  // 자동 배출 이동
      claw.position.x = THREE.MathUtils.lerp(deliverStart.x, CFG.chuteX, p);
      claw.position.z = THREE.MathUtils.lerp(deliverStart.z, CFG.chuteZ, p);
    }else if(state==='drop'){
      claw.position.x = CFG.chuteX; claw.position.z = CFG.chuteZ;
    }

    // ---- 집게 Y (시간기반) ----
    const ty = clawTargetY();
    if(state==='idle') claw.position.y += (ty - claw.position.y)*CFG.lerpY;
    else               claw.position.y = ty;

    // ---- 프롱 개폐 ----
    openAmount += (clawTargetOpen() - openAmount)*CFG.lerpOpen;
    const ang = THREE.MathUtils.lerp(OPEN_CLOSED, OPEN_OPEN, openAmount);
    for(const o of openers) o.rotation.z = ang;

    phaseT += dt;
    updateState(dt);
    updateCable();

    // ---- 들고 있는 인형 동기화 ----
    if(held){
      const p = held.body.position;
      p.set(claw.position.x, claw.position.y - 0.55 - held.r, claw.position.z);
      held.body.velocity.set(0,0,0);
      held.body.angularVelocity.set(0,0,0);
      held.mesh.position.set(p.x, p.y, p.z);
    }

    // ---- 물리 스텝 ----
    world.step(1/60, dt, 4);

    // ---- 메쉬 동기화 + chute 통과 점수 + 수거함 정리 ----
    for(const d of dolls){
      if(d===held) continue;
      const p=d.body.position, q=d.body.quaternion;
      d.mesh.position.set(p.x,p.y,p.z);
      d.mesh.quaternion.set(q.x,q.y,q.z,q.w);
      if(d.parked) continue;
      // chute 구멍 통과 = 점수 (오직 여기서만 +1)
      if(!d.scored && inChuteArea(p.x,p.z,0) && p.y < 0.25){
        d.scored = true; score++; failStreak = 0; updateScore();
        toast('성공! 🎉  +1', 'ok', 1500);
        burst(CFG.chuteX, 0.4, CFG.chuteZ);
      }
      // 수거함 도달 → 정적 고정(깔끔히 보관)
      if(d.scored && p.y < binFloorY + 0.5){ parkInBin(d); }
      // 안전: 세계 밖 → 리스폰
      if(p.y < -4 && !d.scored){ respawnDoll(d); }
    }

    updateSparks(dt);

    // 카메라 모드인데 손 사라지면 핀치 해제(놓기 안전장치)
    if(mode==='cam' && camActive && performance.now()-lastHandTs > 700){
      input.pinch = false;
    }
  }

  // 발광 링 깜빡임
  chuteGlowMat.emissiveIntensity = 0.9 + Math.sin(t*3.2)*0.5;
  chuteGlow.intensity = 4 + Math.sin(t*3.2)*2;

  renderer.render(scene, camera);
}
animate();

/* ============================================================
   시작 / 리사이즈
   ============================================================ */
function beginGame(){
  document.getElementById('overlay').style.display='none';
  started = true;
  setModeLabel();
}
document.getElementById('startMouse').addEventListener('click', ()=>{
  mode='mouse'; beginGame(); toast('마우스·터치 모드로 시작! 🖱️','info',2000);
});
document.getElementById('startCam').addEventListener('click', async()=>{
  beginGame();
  await startCameraMode();
});

addEventListener('resize', ()=>{
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  placeCamera();
});

console.log('[claw] three', THREE.REVISION, '| cannon-es loaded | balls', dolls.length);
</script>
